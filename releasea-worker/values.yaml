replicaCount: 1

install:
  namespace: "releasea-system"
  createNamespace: false

bootstrap:
  mode: "same-cluster"
  profileVersion: ""
  sharedConfig:
    configMapName: "releasea-worker-bootstrap"
    secretName: "releasea-worker-bootstrap"
    optional: false
    keys:
      rabbitmqUrl: "rabbitmqUrl"
      minioAccessKey: "minioAccessKey"
      minioSecretKey: "minioSecretKey"

global:
  routing:
    internalDomain: ""
    externalDomain: ""
    internalGateway: ""
    externalGateway: ""

image:
  repository: releasea/releasea-worker
  tag: "v1.9.2"
  pullPolicy: IfNotPresent

token: ""
environment: "prod"
namespacePrefix: ""
tags: ""
cluster: "k3d-local"

worker:
  id: ""
  name: "releasea-worker"
  environment: ""
  namespace: ""
  token: ""
  version: ""
  heartbeatSeconds: 30
  queueName: "releasea.worker"
  extraEnv: []
  dockerBuildNetwork: "host"

api:
  baseUrl: ""

rabbitmq:
  url: ""

routing:
  internalDomain: ""
  externalDomain: ""
  internalGateway: ""
  externalGateway: ""

minio:
  endpoint: ""
  accessKey: ""
  secretKey: ""
  bucket: ""
  secure: false

staticSite:
  prefix: "sites"
  nginxService: ""
  nginxNamespace: ""

resources: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
hostAliases: []

serviceAccount:
  create: true
  name: ""

rbac:
  create: true
  clusterAdmin: true
  rules: []

dockerDinD:
  enabled: true
  image: "docker:28.2.2-dind"
  pullPolicy: IfNotPresent
  args:
    - "--host=tcp://0.0.0.0:2375"
    - "--host=unix:///var/run/docker.sock"
    - "--log-level=debug"
    - "--insecure-registry=registry.localhost:5010"
    - "--max-concurrent-downloads=10"
  env:
    - name: DOCKER_TLS_CERTDIR
      value: ""
    - name: DOCKERD_FLAGS
      value: "--dns=8.8.8.8"
  resources: {}
  workerDockerHost: "tcp://localhost:2375"
