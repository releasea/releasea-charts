replicaCount: 1

install:
  namespace: "releasea-system"
  createNamespace: false

bootstrap:
  mode: "same-cluster"
  profileVersion: ""
  sharedConfig:
    configMapName: "releasea-worker-bootstrap"
    secretName: "releasea-worker-bootstrap"
    optional: false
    keys:
      rabbitmqUrl: "rabbitmqUrl"
      minioAccessKey: "minioAccessKey"
      minioSecretKey: "minioSecretKey"

global:
  routing:
    internalDomain: ""
    externalDomain: ""
    internalGateway: ""
    externalGateway: ""

image:
  repository: releasea/releasea-worker
  tag: "v1.9.4"
  pullPolicy: IfNotPresent

token: ""
environment: "prod"
namespacePrefix: ""
tags: ""
cluster: "k3d-local"

worker:
  id: ""
  name: "releasea-worker"
  environment: ""
  namespace: ""
  token: ""
  version: ""
  heartbeatSeconds: 30
  queueName: "releasea.worker"
  extraEnv: []
  dockerBuildNetwork: "host"

api:
  baseUrl: ""

rabbitmq:
  url: ""

routing:
  internalDomain: ""
  externalDomain: ""
  internalGateway: ""
  externalGateway: ""

minio:
  endpoint: ""
  accessKey: ""
  secretKey: ""
  bucket: ""
  secure: false

staticSite:
  prefix: "sites"
  nginxService: ""
  nginxNamespace: ""

resources: {}
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
nodeSelector: {}
tolerations: []
affinity: {}
hostAliases: []

serviceAccount:
  create: true
  name: ""

rbac:
  create: true
  # Opting into cluster-admin grants the worker unrestricted control of the
  # cluster. Keep it disabled and extend the scoped rules only when required.
  clusterAdmin: false
  rules:
    - apiGroups: [""]
      resources: ["namespaces"]
      verbs: ["get", "list", "watch", "create", "patch"]
    - apiGroups: [""]
      resources: ["pods", "pods/log", "services", "configmaps", "secrets", "serviceaccounts", "persistentvolumeclaims", "events"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["apps"]
      resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
    - apiGroups: ["autoscaling"]
      resources: ["horizontalpodautoscalers"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses", "networkpolicies"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["policy"]
      resources: ["poddisruptionbudgets"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["networking.istio.io"]
      resources: ["virtualservices", "destinationrules", "gateways"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
    - apiGroups: ["security.istio.io"]
      resources: ["authorizationpolicies", "peerauthentications"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]

dockerDinD:
  # Privileged Docker-in-Docker is opt-in. Prefer an external/rootless builder
  # for production workers.
  enabled: false
  image: "docker:28.2.2-dind"
  pullPolicy: IfNotPresent
  args:
    - "--host=tcp://0.0.0.0:2375"
    - "--host=unix:///var/run/docker.sock"
    - "--log-level=debug"
    - "--insecure-registry=registry.localhost:5010"
    - "--max-concurrent-downloads=10"
  env:
    - name: DOCKER_TLS_CERTDIR
      value: ""
    - name: DOCKERD_FLAGS
      value: "--dns=8.8.8.8"
  resources: {}
  workerDockerHost: "tcp://localhost:2375"
