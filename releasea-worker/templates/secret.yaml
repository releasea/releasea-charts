{{- $token := coalesce .Values.worker.token .Values.token }}
{{- if $token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "releasea-worker.fullname" . }}-token
  labels:
    app.kubernetes.io/name: {{ include "releasea-worker.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
stringData:
  token: {{ $token | quote }}
{{- end }}
