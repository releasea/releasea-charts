name: Publish Helm Repository

on:
  push:
    branches: [main]
    paths:
      - "releasea-platform/**"
      - "releasea-worker/**"
      - ".github/workflows/release-charts.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip charts publish]')"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: releasea-charts-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Compute chart metadata
        id: meta
        run: |
          set -euo pipefail

          semver_bump_type() {
            local msg="$1"
            if printf '%s' "${msg}" | grep -Eiq 'BREAKING[ _-]CHANGE'; then
              echo "major"
              return 0
            fi
            if printf '%s' "${msg}" | grep -Eq '^[a-zA-Z0-9_-]+(\([^)]+\))?!:'; then
              echo "major"
              return 0
            fi
            if printf '%s' "${msg}" | grep -Eiq '\[semver:major\]'; then
              echo "major"
              return 0
            fi
            if printf '%s' "${msg}" | grep -Eiq '\[semver:minor\]'; then
              echo "minor"
              return 0
            fi
            if printf '%s' "${msg}" | grep -Eq '^feat(\([^)]+\))?:'; then
              echo "minor"
              return 0
            fi
            echo "patch"
          }

          semver_next() {
            local current="$1"
            local bump="$2"
            local core major minor patch
            core="${current#v}"
            IFS='.' read -r major minor patch <<< "${core}"
            case "${bump}" in
              major)
                major=$((major + 1)); minor=0; patch=0
                ;;
              minor)
                minor=$((minor + 1)); patch=0
                ;;
              *)
                patch=$((patch + 1))
                ;;
            esac
            echo "v${major}.${minor}.${patch}"
          }

          git fetch --tags --force >/dev/null 2>&1 || true
          latest_tag="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1)"
          if [ -z "${latest_tag}" ]; then
            latest_tag="v1.0.0"
          fi

          commit_msg="$(git log -1 --pretty=%B)"
          bump="$(semver_bump_type "${commit_msg}")"
          latest_tag_sha="$(git rev-list -n1 "${latest_tag}" 2>/dev/null || true)"
          published_index="$(mktemp)"
          published_index_available=false
          latest_tag_published=false
          if curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.yaml?run=${GITHUB_RUN_ID}" -o "${published_index}"; then
            published_index_available=true
            if grep -q "version: ${latest_tag#v}$" "${published_index}"; then
              latest_tag_published=true
            fi
          fi
          if [ -n "${latest_tag_sha}" ] && [ "${latest_tag_sha}" = "${GITHUB_SHA}" ]; then
            release_tag="${latest_tag}"
          elif [ "${published_index_available}" = true ] && [ "${latest_tag_published}" = false ]; then
            release_tag="${latest_tag}"
          elif [ "${latest_tag}" = "v1.0.0" ] && ! git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -q .; then
            release_tag="v1.0.0"
          else
            release_tag="$(semver_next "${latest_tag}" "${bump}")"
          fi

          CHART_VERSION="${release_tag#v}"
          APP_VERSION="g${GITHUB_SHA::8}"
          RELEASE_TAG="${release_tag}"
          BUMP="${bump}"

          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"

      - name: Update Chart.yaml versions
        run: |
          set -euo pipefail
          CHART_VERSION="${{ steps.meta.outputs.chart_version }}"
          APP_VERSION="${{ steps.meta.outputs.app_version }}"
          for chart_dir in releasea-platform releasea-worker; do
            if [ -f "${chart_dir}/Chart.yaml" ]; then
              sed -i "s/^version: .*/version: ${CHART_VERSION}/" "${chart_dir}/Chart.yaml"
              sed -i "s/^appVersion: .*/appVersion: \"${APP_VERSION}\"/" "${chart_dir}/Chart.yaml"
              echo "Updated ${chart_dir}/Chart.yaml: version=${CHART_VERSION}, appVersion=${APP_VERSION}"
            fi
          done

      - name: Stamp image tags from versions manifest
        run: |
          set -euo pipefail
          if [ ! -f versions/images.yaml ]; then
            echo "No versions/images.yaml found, skipping tag stamping."
            exit 0
          fi

          extract_tag() {
            local key="$1"
            local line
            line="$(grep "^  ${key}:" versions/images.yaml || true)"
            if [ -z "${line}" ]; then return; fi
            printf '%s' "${line}" | rev | cut -d: -f1 | rev | tr -d '[:space:]'
          }

          API_TAG="$(extract_tag api)"
          CONSOLE_TAG="$(extract_tag console)"
          WORKER_TAG="$(extract_tag worker)"

          if [ -n "${API_TAG}" ] && [ -f releasea-platform/values.yaml ]; then
            sed -i "/repository: releasea\/releasea-api/{n;s/tag: .*/tag: \"${API_TAG}\"/}" releasea-platform/values.yaml
            echo "Stamped api.image.tag=${API_TAG}"
          fi
          if [ -n "${CONSOLE_TAG}" ] && [ -f releasea-platform/values.yaml ]; then
            sed -i "/repository: releasea\/releasea-console/{n;s/tag: .*/tag: \"${CONSOLE_TAG}\"/}" releasea-platform/values.yaml
            echo "Stamped console.image.tag=${CONSOLE_TAG}"
          fi
          if [ -n "${WORKER_TAG}" ] && [ -f releasea-worker/values.yaml ]; then
            sed -i "/repository: releasea\/releasea-worker/{n;s/tag: .*/tag: \"${WORKER_TAG}\"/}" releasea-worker/values.yaml
            echo "Stamped image.tag=${WORKER_TAG}"
          fi

      - name: Build dependencies
        run: |
          set -euo pipefail
          helm dependency build ./releasea-platform
          if [ -f ./releasea-worker/Chart.yaml ]; then
            helm dependency build ./releasea-worker || true
          fi

      - name: Package charts
        run: |
          set -euo pipefail
          mkdir -p .dist
          CHART_VERSION="${{ steps.meta.outputs.chart_version }}"
          APP_VERSION="${{ steps.meta.outputs.app_version }}"

          helm package ./releasea-worker \
            --destination .dist \
            --version "${CHART_VERSION}" \
            --app-version "${APP_VERSION}"
          helm package ./releasea-platform \
            --destination .dist \
            --version "${CHART_VERSION}" \
            --app-version "${APP_VERSION}"

      - name: Create or update chart release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.release_tag }}"
          title="${tag}"
          notes="Automated Helm chart release for commit ${GITHUB_SHA::8}."

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" .dist/*.tgz --clobber
          else
            gh release create "${tag}" .dist/*.tgz \
              --title "${title}" \
              --notes "${notes}"
          fi

      - name: Build index.yaml
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.release_tag }}"
          current_index="$(mktemp)"
          if curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/index.yaml?run=${GITHUB_RUN_ID}" -o "${current_index}"; then
            helm repo index .dist \
              --url "https://github.com/${{ github.repository }}/releases/download/${tag}" \
              --merge "${current_index}"
          elif [ -f index.yaml ]; then
            helm repo index .dist \
              --url "https://github.com/${{ github.repository }}/releases/download/${tag}" \
              --merge index.yaml
          else
            helm repo index .dist \
              --url "https://github.com/${{ github.repository }}/releases/download/${tag}"
          fi

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p .pages
          cp -f .dist/index.yaml .pages/index.yaml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

      - name: Deploy Helm repository index
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify release and index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${{ steps.meta.outputs.release_tag }}" >/dev/null
          grep -q "version: ${{ steps.meta.outputs.chart_version }}" .dist/index.yaml
