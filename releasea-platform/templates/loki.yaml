{{- if .Values.loki.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: releasea-loki-config
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: {{ .Values.loki.service.port }}
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    compactor:
      working_directory: /loki/compactor
{{- if .Values.loki.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: releasea-loki-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.loki.persistence.size }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: releasea-loki
  annotations:
    releasea.io/default-log-store: {{ .Values.loki.isDefault | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: releasea-loki
  template:
    metadata:
      labels:
        app: releasea-loki
    spec:
      containers:
        - name: loki
          image: {{ .Values.loki.image | quote }}
          args:
            - -config.file=/etc/loki/config/config.yaml
          ports:
            - containerPort: {{ .Values.loki.service.port }}
          volumeMounts:
            - name: config
              mountPath: /etc/loki/config
            - name: data
              mountPath: /loki
          {{- with .Values.loki.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: releasea-loki-config
        - name: data
          {{- if .Values.loki.persistence.enabled }}
          persistentVolumeClaim:
            claimName: releasea-loki-data
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: releasea-loki
spec:
  selector:
    app: releasea-loki
  ports:
    - name: http
      port: {{ .Values.loki.service.port }}
      targetPort: {{ .Values.loki.service.port }}
{{- if .Values.loki.promtail.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: releasea-promtail
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: releasea-promtail
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: releasea-promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: releasea-promtail
subjects:
  - kind: ServiceAccount
    name: releasea-promtail
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: releasea-promtail-config
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://releasea-loki:{{ .Values.loki.service.port }}/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: releasea-promtail
spec:
  selector:
    matchLabels:
      app: releasea-promtail
  template:
    metadata:
      labels:
        app: releasea-promtail
    spec:
      serviceAccountName: releasea-promtail
      containers:
        - name: promtail
          image: {{ .Values.loki.promtail.image | quote }}
          args:
            - -config.file=/etc/promtail/promtail.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: run
              mountPath: /run/promtail
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: podlogs
              mountPath: /var/log/pods
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: releasea-promtail-config
        - name: run
          emptyDir: {}
        - name: varlog
          hostPath:
            path: /var/log
        - name: podlogs
          hostPath:
            path: /var/log/pods
{{- end }}
{{- end }}
