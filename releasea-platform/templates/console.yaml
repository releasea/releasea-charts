{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "releasea-platform.fullname" . }}-console
  labels:
    {{- include "releasea-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.console.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "releasea-platform.name" . }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "releasea-platform.name" . }}
        app.kubernetes.io/component: console
    spec:
      containers:
        - name: console
          image: "{{ .Values.console.image.repository }}:{{ include "releasea-platform.imageTag" (list .Values.console.image.tag .Values.global.imageTag) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.console.service.port }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.console.service.port }}
            initialDelaySeconds: 8
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: releasea-console
  labels:
    {{- include "releasea-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  type: {{ .Values.console.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "releasea-platform.name" . }}
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: {{ .Values.console.service.port }}
{{- if .Values.console.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "releasea-platform.fullname" . }}-console
  labels:
    {{- include "releasea-platform.labels" . | nindent 4 }}
spec:
  {{- if .Values.console.ingress.className }}
  ingressClassName: {{ .Values.console.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.console.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.console.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: releasea-console
                port:
                  number: {{ .Values.console.service.port }}
{{- end }}
{{- end }}
