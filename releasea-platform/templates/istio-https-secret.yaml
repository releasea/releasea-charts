{{- if and .Values.istio.enabled .Values.istio.https.enabled }}
{{- $mode := default "existingSecret" .Values.istio.https.secret.mode }}
{{- $secretNamespace := default .Values.istio.namespace .Values.istio.https.secret.namespace }}
{{- if eq $mode "inline" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.istio.https.credentialName }}
  namespace: {{ $secretNamespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ required "istio.https.secret.inlineCrt is required when istio.https.secret.mode=inline" .Values.istio.https.secret.inlineCrt | b64enc }}
  tls.key: {{ required "istio.https.secret.inlineKey is required when istio.https.secret.mode=inline" .Values.istio.https.secret.inlineKey | b64enc }}
{{- else if eq $mode "selfSigned" }}
{{- $defaultAlts := list .Values.istio.gateways.internal.host .Values.istio.gateways.external.host }}
{{- $altNames := default $defaultAlts .Values.istio.https.selfSigned.altNames }}
{{- $commonName := default (index $altNames 0) .Values.istio.https.selfSigned.commonName }}
{{- $days := int (default 365 .Values.istio.https.selfSigned.days) }}
{{- $cert := genSelfSignedCert $commonName nil $altNames $days }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.istio.https.credentialName }}
  namespace: {{ $secretNamespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
