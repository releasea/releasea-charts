{{- if .Values.staticNginx.enabled }}
{{- $internalDomain := include "releasea-platform.routing.internalDomain" . | trim }}
{{- $externalDomain := include "releasea-platform.routing.externalDomain" . | trim }}
{{- $minioEndpoint := coalesce .Values.minio.external.endpoint (ternary (printf "releasea-minio.%s.svc.cluster.local:%v" .Release.Namespace .Values.minio.service.apiPort) "" .Values.minio.enabled) }}
{{- $minioBucket := coalesce .Values.minio.external.bucket .Values.minio.bucket }}
{{- $minioSecure := .Values.minio.external.secure }}
{{- if eq $minioSecure nil }}
{{- $minioSecure = .Values.minio.secure }}
{{- end }}
{{- $minioScheme := ternary "https" "http" $minioSecure }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: releasea-static-nginx
  labels:
    {{- include "releasea-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: static-nginx
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 65;
      resolver {{ .Values.staticNginx.dnsResolver }} valid=10s;
      resolver_timeout 5s;

      map $host $site_prefix {
        default "";
        ~^(?<subdomain>[^.]+)\.{{ $internalDomain | replace "." "\\." }}$ $subdomain;
        ~^(?<subdomain>[^.]+)\.{{ $externalDomain | replace "." "\\." }}$ $subdomain;
      }

      server {
        listen 80;
        server_name _;

        if ($site_prefix = "") {
          return 404;
        }

        location / {
          proxy_set_header Host {{ $minioEndpoint }};
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_intercept_errors on;
          error_page 404 = /__static_fallback;
          proxy_pass {{ $minioScheme }}://{{ $minioEndpoint }}/{{ $minioBucket }}/{{ .Values.staticNginx.sitePrefix }}/$site_prefix$uri;
        }

        location = /__static_fallback {
          proxy_set_header Host {{ $minioEndpoint }};
          proxy_pass {{ $minioScheme }}://{{ $minioEndpoint }}/{{ $minioBucket }}/{{ .Values.staticNginx.sitePrefix }}/$site_prefix/index.html;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: releasea-static-nginx
  labels:
    {{- include "releasea-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: static-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: releasea-static-nginx
  template:
    metadata:
      labels:
        app: releasea-static-nginx
    spec:
      containers:
        - name: nginx
          image: {{ .Values.staticNginx.image | quote }}
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          {{- with .Values.staticNginx.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: releasea-static-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: releasea-static-nginx
  labels:
    {{- include "releasea-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: static-nginx
spec:
  selector:
    app: releasea-static-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
{{- end }}
