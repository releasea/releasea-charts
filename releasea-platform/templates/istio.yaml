{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: releasea-internal-gateway
  namespace: {{ .Values.istio.namespace }}
spec:
  selector:
    {{- toYaml .Values.istio.gatewaySelector | nindent 4 }}
  servers:
    - port:
        number: 80
        name: http-internal
        protocol: HTTP
      hosts:
        - {{ .Values.istio.gateways.internal.host | quote }}
    {{- if .Values.istio.https.enabled }}
    - port:
        number: 443
        name: https-internal
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.istio.https.credentialName | quote }}
      hosts:
        - {{ .Values.istio.gateways.internal.host | quote }}
    {{- end }}
---
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: releasea-external-gateway
  namespace: {{ .Values.istio.namespace }}
spec:
  selector:
    {{- toYaml .Values.istio.gatewaySelector | nindent 4 }}
  servers:
    - port:
        number: 80
        name: http-external
        protocol: HTTP
      hosts:
        - {{ .Values.istio.gateways.external.host | quote }}
    {{- if .Values.istio.https.enabled }}
    - port:
        number: 443
        name: https-external
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: {{ .Values.istio.https.credentialName | quote }}
      hosts:
        - {{ .Values.istio.gateways.external.host | quote }}
    {{- end }}
{{- if and .Values.istio.envoyPodMonitor.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/PodMonitor") }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-envoy-stats
  namespace: {{ .Values.istio.envoyPodMonitor.namespace }}
spec:
  namespaceSelector:
    any: true
  selector:
    matchExpressions:
      - key: security.istio.io/tlsMode
        operator: Exists
  podMetricsEndpoints:
    - path: /stats/prometheus
      interval: {{ .Values.istio.envoyPodMonitor.interval }}
      scheme: http
      targetPort: 15090
{{- end }}
{{- end }}
