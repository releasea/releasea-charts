{{- if .Values.api.enabled }}
{{- $apiEnv := .Values.api.env | default dict }}
{{- $routingInternalDomain := include "releasea-platform.routing.internalDomain" . | trim }}
{{- $routingExternalDomain := include "releasea-platform.routing.externalDomain" . | trim }}
{{- $routingInternalGateway := include "releasea-platform.routing.internalGateway" . | trim }}
{{- $routingExternalGateway := include "releasea-platform.routing.externalGateway" . | trim }}
{{- $platformNamespace := default .Release.Namespace .Values.workerBootstrap.platformNamespace }}
{{- $workerBootstrapMode := default "same-cluster" .Values.workerBootstrap.mode }}
{{- $workerBootstrapVersion := default "1" .Values.workerBootstrap.version }}
{{- $workerBootstrapConfigMap := "releasea-worker-bootstrap" }}
{{- $workerBootstrapSecret := "releasea-worker-bootstrap" }}
{{- $workerBootstrapNamespacePrefix := default "releasea-apps" .Values.workerBootstrap.namespacePrefix }}
{{- $workerBootstrapAPIBaseURL := default (printf "http://releasea-api.%s.svc.cluster.local:%v/api/v1" $platformNamespace .Values.api.service.port) .Values.workerBootstrap.apiBaseUrl }}
{{- $workerBootstrapRabbitURL := default (printf "amqp://%s:%s@releasea-rabbitmq.%s.svc.cluster.local:%v/" .Values.rabbitmq.auth.username .Values.rabbitmq.auth.password $platformNamespace .Values.rabbitmq.service.amqpPort) .Values.workerBootstrap.rabbitmqUrl }}
{{- $workerBootstrapMinioEndpoint := default (printf "releasea-minio.%s.svc.cluster.local:%v" $platformNamespace .Values.minio.service.apiPort) .Values.workerBootstrap.minioEndpoint }}
{{- $workerBootstrapMinioBucket := default .Values.minio.bucket .Values.workerBootstrap.minioBucket }}
{{- $workerBootstrapMinioSecure := .Values.workerBootstrap.minioSecure }}
{{- if eq $workerBootstrapMinioSecure nil }}
{{- $workerBootstrapMinioSecure = .Values.minio.secure }}
{{- end }}
{{- $workerBootstrapStaticService := default "releasea-static-nginx" .Values.workerBootstrap.staticNginxService }}
{{- $workerBootstrapStaticNamespace := default $platformNamespace .Values.workerBootstrap.staticNginxNamespace }}
{{- $bootstrapDevWorkerEnabled := default true .Values.bootstrapDevWorker.enabled }}
{{- $bootstrapDevWorkerTokenSecretName := include "releasea-platform.bootstrapDevWorker.tokenSecretName" . | trim }}
{{- $bootstrapDevWorkerID := "wkr-reg-bootstrap-dev" }}
{{- $bootstrapDevWorkerName := "Development Worker" }}
{{- $bootstrapDevWorkerEnvironment := "dev" }}
{{- $bootstrapDevWorkerNamespace := $platformNamespace }}
{{- $bootstrapDevWorkerNamespacePrefix := $workerBootstrapNamespacePrefix }}
{{- $bootstrapDevWorkerCluster := "quickstart-local" }}
{{- $bootstrapDevWorkerTags := "dev,build" }}
{{- $bootstrapDevWorkerNotes := "Managed bootstrap worker for quickstart and local installs." }}
{{- $internalDomain := coalesce (index $apiEnv "RELEASEA_INTERNAL_DOMAIN") $routingInternalDomain }}
{{- $externalDomain := coalesce (index $apiEnv "RELEASEA_EXTERNAL_DOMAIN") $routingExternalDomain }}
{{- $internalGateway := coalesce (index $apiEnv "RELEASEA_INTERNAL_GATEWAY") $routingInternalGateway }}
{{- $externalGateway := coalesce (index $apiEnv "RELEASEA_EXTERNAL_GATEWAY") $routingExternalGateway }}
{{- $reservedRoutingEnv := dict
  "RELEASEA_INTERNAL_DOMAIN" true
  "RELEASEA_EXTERNAL_DOMAIN" true
  "RELEASEA_INTERNAL_GATEWAY" true
  "RELEASEA_EXTERNAL_GATEWAY" true
}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "releasea-platform.fullname" . }}-api
  labels:
    {{- include "releasea-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "releasea-platform.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "releasea-platform.name" . }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ include "releasea-platform.imageTag" (list .Values.api.image.tag .Values.global.imageTag) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.api.service.port }}
          env:
            {{- range $k, $v := $apiEnv }}
            {{- if not (hasKey $reservedRoutingEnv $k) }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            - name: RELEASEA_INTERNAL_DOMAIN
              value: {{ $internalDomain | quote }}
            - name: RELEASEA_EXTERNAL_DOMAIN
              value: {{ $externalDomain | quote }}
            - name: RELEASEA_INTERNAL_GATEWAY
              value: {{ $internalGateway | quote }}
            - name: RELEASEA_EXTERNAL_GATEWAY
              value: {{ $externalGateway | quote }}
            - name: RELEASEA_SYSTEM_NAMESPACE
              value: {{ $platformNamespace | quote }}
            - name: RELEASEA_WORKER_BOOTSTRAP_MODE
              value: {{ $workerBootstrapMode | quote }}
            - name: RELEASEA_WORKER_BOOTSTRAP_VERSION
              value: {{ $workerBootstrapVersion | quote }}
            - name: RELEASEA_WORKER_BOOTSTRAP_CONFIGMAP
              value: {{ $workerBootstrapConfigMap | quote }}
            - name: RELEASEA_WORKER_BOOTSTRAP_SECRET
              value: {{ $workerBootstrapSecret | quote }}
            - name: RELEASEA_WORKER_BOOTSTRAP_NAMESPACE_PREFIX
              value: {{ $workerBootstrapNamespacePrefix | quote }}
            - name: RELEASEA_WORKER_BOOTSTRAP_API_BASE_URL
              value: {{ $workerBootstrapAPIBaseURL | quote }}
            - name: RELEASEA_WORKER_BOOTSTRAP_RABBITMQ_URL
              value: {{ $workerBootstrapRabbitURL | quote }}
            - name: RELEASEA_WORKER_BOOTSTRAP_INTERNAL_DOMAIN
              value: {{ $internalDomain | quote }}
            - name: RELEASEA_WORKER_BOOTSTRAP_EXTERNAL_DOMAIN
              value: {{ $externalDomain | quote }}
            - name: RELEASEA_WORKER_BOOTSTRAP_INTERNAL_GATEWAY
              value: {{ $internalGateway | quote }}
            - name: RELEASEA_WORKER_BOOTSTRAP_EXTERNAL_GATEWAY
              value: {{ $externalGateway | quote }}
            - name: RELEASEA_WORKER_BOOTSTRAP_MINIO_ENDPOINT
              value: {{ $workerBootstrapMinioEndpoint | quote }}
            - name: RELEASEA_WORKER_BOOTSTRAP_MINIO_BUCKET
              value: {{ $workerBootstrapMinioBucket | quote }}
            - name: RELEASEA_WORKER_BOOTSTRAP_MINIO_SECURE
              value: {{ $workerBootstrapMinioSecure | quote }}
            - name: RELEASEA_WORKER_BOOTSTRAP_STATIC_NGINX_SERVICE
              value: {{ $workerBootstrapStaticService | quote }}
            - name: RELEASEA_WORKER_BOOTSTRAP_STATIC_NGINX_NAMESPACE
              value: {{ $workerBootstrapStaticNamespace | quote }}
            - name: RELEASEA_BOOTSTRAP_DEV_WORKER_ENABLED
              value: {{ $bootstrapDevWorkerEnabled | quote }}
            - name: RELEASEA_BOOTSTRAP_DEV_WORKER_ID
              value: {{ $bootstrapDevWorkerID | quote }}
            - name: RELEASEA_BOOTSTRAP_DEV_WORKER_NAME
              value: {{ $bootstrapDevWorkerName | quote }}
            - name: RELEASEA_BOOTSTRAP_DEV_WORKER_ENVIRONMENT
              value: {{ $bootstrapDevWorkerEnvironment | quote }}
            - name: RELEASEA_BOOTSTRAP_DEV_WORKER_NAMESPACE
              value: {{ $bootstrapDevWorkerNamespace | quote }}
            - name: RELEASEA_BOOTSTRAP_DEV_WORKER_NAMESPACE_PREFIX
              value: {{ $bootstrapDevWorkerNamespacePrefix | quote }}
            - name: RELEASEA_BOOTSTRAP_DEV_WORKER_CLUSTER
              value: {{ $bootstrapDevWorkerCluster | quote }}
            - name: RELEASEA_BOOTSTRAP_DEV_WORKER_TAGS
              value: {{ $bootstrapDevWorkerTags | quote }}
            - name: RELEASEA_BOOTSTRAP_DEV_WORKER_NOTES
              value: {{ $bootstrapDevWorkerNotes | quote }}
            {{- if $bootstrapDevWorkerEnabled }}
            - name: RELEASEA_BOOTSTRAP_DEV_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapDevWorkerTokenSecretName }}
                  key: token
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.api.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: releasea-api
  labels:
    {{- include "releasea-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "releasea-platform.name" . }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.port }}
{{- end }}
