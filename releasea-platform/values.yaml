global:
  imageTag: latest
  imagePullPolicy: IfNotPresent
  routing:
    internalDomain: "releasea.internal"
    externalDomain: "releasea.external"
    internalGateway: "istio-system/releasea-internal-gateway"
    externalGateway: "istio-system/releasea-external-gateway"

workerBootstrap:
  enabled: true
  mode: "same-cluster"
  version: "1"
  platformNamespace: ""
  namespacePrefix: "releasea-apps"
  configMapName: "releasea-worker-bootstrap"
  secretName: "releasea-worker-bootstrap"
  apiBaseUrl: ""
  rabbitmqUrl: ""
  minioEndpoint: ""
  minioBucket: ""
  minioSecure: null
  staticNginxService: "releasea-static-nginx"
  staticNginxNamespace: ""

api:
  enabled: true
  replicaCount: 1
  image:
    repository: releasea/releasea-api
    tag: "v1.6.0"
  service:
    type: ClusterIP
    port: 8070
  env:
    PORT: "8070"
    MONGO_URI: mongodb://releasea-mongodb:27017/releasea
    RABBITMQ_URL: amqp://releasea:releasea@releasea-rabbitmq:5672/
    PROMETHEUS_URL: http://releasea-prometheus:9090
    LOKI_URL: http://releasea-loki:3100

console:
  enabled: true
  replicaCount: 1
  image:
    repository: releasea/releasea-console
    tag: "v1.7.0"
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: false
    className: ""
    host: ""
    path: /

mongodb:
  enabled: true
  image: mongo:7
  service:
    port: 27017
  persistence:
    enabled: false
    size: 8Gi

rabbitmq:
  enabled: true
  image: rabbitmq:3.13-management
  service:
    amqpPort: 5672
    managementPort: 15672
  auth:
    username: releasea
    password: releasea

minio:
  enabled: true
  image: minio/minio:latest
  service:
    apiPort: 9000
    consolePort: 9001
  accessKey: releasea
  secretKey: releaseaadmin
  bucket: releasea-static
  persistence:
    enabled: false
    size: 10Gi

staticNginx:
  enabled: true
  image: "nginx:1.27-alpine"
  dnsResolver: "10.43.0.10"
  internalDomain: ""
  externalDomain: ""
  sitePrefix: "sites"
  resources: {}

prometheus:
  enabled: true
  image: prom/prometheus:v2.55.1
  retention: 6h
  scrapeInterval: 30s
  evaluationInterval: 30s
  service:
    port: 9090
  resources: {}

loki:
  enabled: true
  isDefault: true
  image: grafana/loki:3.1.1
  persistence:
    enabled: false
    size: 10Gi
  service:
    port: 3100
  promtail:
    enabled: true
    image: grafana/promtail:3.1.1
  grafana:
    enabled: false
  resources: {}
