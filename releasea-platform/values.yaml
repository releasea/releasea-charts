global:
  imageTag: latest
  imagePullPolicy: IfNotPresent
  routing:
    mode: "auto"
    gatewayNamespace: "istio-system"
    internalGatewayName: "releasea-internal-gateway"
    externalGatewayName: "releasea-external-gateway"
    internalDomain: ""
    externalDomain: ""
    internalGateway: ""
    externalGateway: ""

workerBootstrap:
  enabled: true
  mode: "same-cluster"
  version: "1"
  platformNamespace: ""
  namespacePrefix: "releasea-apps"
  existingSecret:
    name: ""
    rabbitmqUrlKey: "rabbitmqUrl"
    minioAccessKeyKey: "minioAccessKey"
    minioSecretKeyKey: "minioSecretKey"
  apiBaseUrl: ""
  rabbitmqUrl: ""
  minioEndpoint: ""
  minioBucket: ""
  minioSecure: null
  staticNginxService: "releasea-static-nginx"
  staticNginxNamespace: ""

bootstrapDevWorker:
  enabled: true

api:
  enabled: true
  replicaCount: 1
  image:
    repository: releasea/releasea-api
    tag: "v1.10.3"
  service:
    type: ClusterIP
    port: 8070
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  env:
    PORT: "8070"

console:
  enabled: true
  replicaCount: 1
  image:
    repository: releasea/releasea-console
    tag: "v1.13.8"
  service:
    type: ClusterIP
    port: 8080
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  ingress:
    enabled: false
    className: ""
    host: ""
    path: /

mongodb:
  enabled: true
  image: mongo:7
  service:
    port: 27017
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    enabled: false
    size: 8Gi
    storageClassName: ""
  external:
    uri: ""
    existingSecret:
      name: ""
      uriKey: "uri"

rabbitmq:
  enabled: true
  image: rabbitmq:3.13-management
  service:
    type: ClusterIP
    amqpPort: 5672
    managementPort: 15672
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    enabled: false
    size: 8Gi
    storageClassName: ""
  auth:
    username: releasea
    password: releasea
  external:
    url: ""
    existingSecret:
      name: ""
      urlKey: "rabbitmqUrl"

minio:
  enabled: true
  image: minio/minio:latest
  service:
    type: ClusterIP
    apiPort: 9000
    consolePort: 9001
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  accessKey: releasea
  secretKey: releaseaadmin
  bucket: releasea-static
  secure: false
  persistence:
    enabled: false
    size: 10Gi
    storageClassName: ""
  external:
    endpoint: ""
    accessKey: ""
    secretKey: ""
    bucket: ""
    secure: null

staticNginx:
  enabled: true
  image: "nginx:1.27-alpine"
  dnsResolver: "10.43.0.10"
  internalDomain: ""
  externalDomain: ""
  sitePrefix: "sites"
  resources: {}

prometheus:
  enabled: true
  image: prom/prometheus:v2.55.1
  retention: 6h
  scrapeInterval: 30s
  evaluationInterval: 30s
  service:
    type: ClusterIP
    port: 9090
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    enabled: false
    size: 20Gi
    storageClassName: ""
  resources: {}
  external:
    url: ""

loki:
  enabled: true
  isDefault: true
  image: grafana/loki:3.1.1
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  persistence:
    enabled: false
    size: 10Gi
    storageClassName: ""
  service:
    type: ClusterIP
    port: 3100
  promtail:
    enabled: true
    image: grafana/promtail:3.1.1
  grafana:
    enabled: false
  resources: {}
  external:
    url: ""
